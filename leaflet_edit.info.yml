name: 'Leaflet Map Editor'
type: module
description: 'Display and edit GeoJSON files on a Leaflet map, with save and revision history.'
core_version_requirement: ^10.2
package: 'Custom'
configure: leaflet_edit.settings
dependencies:
  - drupal:leaflet
  - drupal:node
  - drupal:user
  - drupal:options
  - drupal:text
  - geofield:geofield
  - geophp:geophp
  - geofile_field:geofile_field
