leaflet_edit.settings:
  path: '/admin/config/system/leaflet-edit'
  defaults:
    _form: '\Drupal\leaflet_edit\Form\SettingsForm'
    _title: 'Leaflet Edit'
  requirements:
    _permission: 'administer leaflet edit'
  options:
    _admin_route: TRUE

leaflet_edit.map:
  path: '/leaflet-edit/map/{node}'
  defaults:
    _controller: '\Drupal\leaflet_edit\Controller\DefaultController::map'
    _title: 'Leaflet map editor'
  requirements:
    node: '\d+'
    _entity_access: 'node.view'
  options:
    parameters:
      node:
        type: entity:node

leaflet_edit.save:
  path: '/leaflet-edit/save'
  defaults:
    _controller: '\Drupal\leaflet_edit\Controller\DefaultController::saveFile'
    _title: 'Save GeoJSON'
  methods: [POST]
  requirements:
    _permission: 'save leaflet tracks'
    _csrf_token: 'TRUE'
  options:
    no_cache: 'TRUE'

leaflet_edit.export_gpx:
  path: '/leaflet-edit/export-gpx'
  defaults:
    _controller: '\Drupal\leaflet_edit\Controller\DefaultController::exportToGpx'
    _title: 'Export GPX'
  methods: [POST]
  requirements:
    _permission: 'export leaflet tracks to gpx'
    _csrf_token: 'TRUE'
  options:
    no_cache: 'TRUE'

leaflet_edit.export_gpx_merge:
  path: '/leaflet-edit/export-gpx-merge'
  defaults:
    _controller: '\Drupal\leaflet_edit\Controller\DefaultController::exportToGpxMerge'
    _title: 'Export merged GPX'
  methods: [POST]
  requirements:
    _permission: 'export leaflet tracks to gpx'
    _csrf_token: 'TRUE'
  options:
    no_cache: 'TRUE'
